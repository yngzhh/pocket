<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Single Page App</title>
    <script type="text/javascript">
      // 获取当前页面的完整路径
      var l = window.location;
      // 重定向到 index.html，并把原始路径作为参数传递
      window.location.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/?/" +
          l.pathname.slice(1) + l.search + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
